<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101116">
    <title>Chat privado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="login-screen" id="loginScreen">
        <div class="login-card">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-5.5 4v-4.2A2.5 2.5 0 0 1 4 13.5z"/></svg>
            </div>
            <p class="eyebrow">ACCESO PRIVADO</p>
            <h1>Chat privado</h1>
            <p class="login-description">Selecciona el color que te identifica e introduce la clave de acceso.</p>

            <label class="field-label">Tu identificador</label>
            <div class="color-options" role="group" aria-label="Selecciona tu color">
                <button type="button" class="color-option selected" data-color="rosa" aria-pressed="true">
                    <span class="color-swatch rose"></span><span>Rosa</span><span class="radio-mark"></span>
                </button>
                <button type="button" class="color-option" data-color="azul" aria-pressed="false">
                    <span class="color-swatch blue"></span><span>Azul</span><span class="radio-mark"></span>
                </button>
            </div>
            <label class="field-label" for="passwordInput">Contraseña</label>
            <input type="password" id="passwordInput" placeholder="Introduce la contraseña" autocomplete="current-password">
            <button id="loginBtn" class="primary-button">Entrar al chat <span>→</span></button>
            <span class="login-error" id="loginError" role="alert"></span>
            <div class="secure-note"><span class="secure-dot"></span> Acceso limitado a dos participantes</div>
        </div>
    </section>

    <section class="chat-container hidden" id="chatContainer">
        <header class="chat-header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-5.5 4v-4.2A2.5 2.5 0 0 1 4 13.5z"/></svg>
            </div>
            <div class="header-copy">
                <h2>Chat privado</h2>
                <div class="status-line"><span class="status-dot" id="statusDot"></span><span id="statusText">Conectando…</span></div>
            </div>
            <div class="you-badge" id="youBadge">ROSA</div>
        </header>
        <div class="conversation-label">CONVERSACIÓN</div>
        <main class="chat-body" id="chatBody" aria-live="polite"></main>
        <div class="typing-indicator hidden" id="typingIndicator"><span class="typing-dots"><i></i><i></i><i></i></span><span id="typingText">Escribiendo…</span></div>
        <footer class="chat-footer">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje…" autocomplete="off" maxlength="2000">
            <button id="sendBtn" aria-label="Enviar mensaje">
                <svg viewBox="0 0 24 24"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg>
            </button>
        </footer>
        <div class="footer-note">CHAT PRIVADO · DOS PARTICIPANTES</div>
    </section>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
